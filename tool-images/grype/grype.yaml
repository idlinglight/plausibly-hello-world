# Grype config (ignore rules only).
# Each rule names vulnerability + package + exact installed version, so it
# stops matching once the package moves; `reason` shows in every scan
# summary. Each rule's analysis, sources and decision: tool-images/README.md.
ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
      version: 1.3.2-r0
      type: apk
    reason: >-
      gzFile API only (gz_vacate via non-blocking gzwrite/gzprintf); nginx uses
      deflate/inflate streams, binary doesn't import gzwrite; apk-tools never
      runs. Owner decision 2026-10-29.
