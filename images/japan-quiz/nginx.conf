# Replaces the base image's /etc/nginx/conf.d/default.conf (included inside
# the http {} block).
# The base image's nginx.conf already puts pid + temp paths under /tmp, so the
# container runs with a read-only root filesystem given a writable /tmp.

# Cache-Control per URI, sent by the single server-level add_header below.
# nginx inherits add_header into a location only if that location sets none
# of its own; one add_header in a location would silently drop every security
# header. So no location sets headers; per-URI values go through this map.
map $uri $phw_cache_control {
    default       "no-cache";   # files aren't hash-named: always revalidate (ETag)
    /version.txt  "no-store";
    /healthz      "no-store";
}

# Access log: one JSON object per line, incl. the Host header (which hostname
# a request used). Log parsers read these key names: don't rename or drop
# keys, add new ones freely. escape=json escapes quotes, backslashes and
# control characters; bytes > 126 are written as-is.
log_format json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,'
  '"bytes":$body_bytes_sent,"referer":"$http_referer","agent":"$http_user_agent",'
  '"xff":"$http_x_forwarded_for","host":"$http_host"}';

server {
    # 8080: the process runs as uid 101 and can't bind privileged ports.
    # IPv4 only — a [::] listener fails to start where IPv6 is disabled.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Same file as the base image's http-level `access_log ... main` (a
    # symlink to stdout), which this replaces. Set here, not at http level:
    # there it would log alongside `main`, every request twice.
    access_log /var/log/nginx/access.log json;

    # The page is self-contained (no external requests, no inline script or
    # style), so the CSP can be strict. `always`: also on 404s etc.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $phw_cache_control always;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Liveness/readiness probe target: no disk access, no access-log noise.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cache-Control: no-store comes from the map above.
    location = /version.txt {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
