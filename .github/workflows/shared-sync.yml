name: shared-sync

# Copies of shared/ files in the image folders match their sources
# (shared/sync.py --check), and the offline tests run: the sync script, the
# map generator core, the Wikipedia title checker, the node tests (engine,
# per-image tools/). Runner's own python3 and node, no setup actions.
on:
  pull_request:
    paths:
      - 'shared/**'
      - 'images/**'
      - '.github/workflows/shared-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'shared/**'
      - 'images/**'
      - '.github/workflows/shared-sync.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Synced copies match shared/
        run: python3 shared/sync.py --check

      - name: Sync script (scratch repositories)
        run: python3 -I shared/sync_test.py

      - name: Map generator core (synthetic data)
        run: python3 -I shared/map-quiz/tools/mapgen_test.py

      - name: Wikipedia title checker (offline logic)
        run: python3 -I shared/map-quiz/tools/wikicheck_test.py

      - name: Node tests (engine, per-image data)
        run: |
          set -euo pipefail
          v=$(node -p 'process.versions.node')
          echo "node $v"
          if ! node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 22 || (a === 22 && b >= 12) ? 0 : 1)'; then
            echo "::error::the node tests need Node 22.12+ (ES modules in .js files without a package.json); this runner has $v"
            exit 1
          fi
          shopt -s nullglob
          for t in shared/map-quiz/tools/*.test.mjs images/*/tools/*.test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
