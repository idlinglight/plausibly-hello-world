name: image-vienna-districts

# Build of images/vienna-districts: verify on pull requests, verify + publish on main.
# The logic is in _build-image.yml; how the callers work: README.md here.
on:
  push:
    branches:
      - main
    paths:
      - 'images/vienna-districts/**'
      - '!images/vienna-districts/tools/**'
      - '.github/workflows/image-vienna-districts.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'
  pull_request:
    paths:
      - 'images/vienna-districts/**'
      - '!images/vienna-districts/tools/**'
      - '.github/workflows/image-vienna-districts.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'

permissions:
  contents: read

jobs:
  build:
    # The ceiling for _build-image.yml's jobs (README.md here).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: vienna-districts
