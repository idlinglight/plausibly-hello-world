name: _build-image

# Reusable: verify + publish ONE image folder (images/<image>/). Not triggered
# directly. Callers own the triggers and pass the folder name: one thin
# image-<name>.yml per image (PR / main / dispatch, paths-filtered) and the
# build-image-branch.yml fan-out (build-image/**, all images).
# Spec: /CLAUDE.md "Image contract".
#
#   verify   every trigger, PRs included: lint the Dockerfile against the
#            contract, build BOTH platforms, load amd64, smoke-test it
#            read-only. A base-image bump PR is therefore proven before
#            merge — not only after, when publish would be the first build.
#   publish  needs verify, never on pull_request: multi-arch push to
#            ghcr.io/<owner>/<repo>/<image>, tags sha-<short7> (always) +
#            latest (default branch head only).
#
# BuildKit runs digest-pinned (.github/tool-images/buildkit/Dockerfile)
# instead of setup-buildx's floating default. No setup-qemu-action on
# purpose: the contract makes Dockerfiles COPY-only, so arm64 builds need
# no emulation — and a RUN fails loudly in the lint step instead of
# silently depending on QEMU.
#
# Permissions: a called workflow's GITHUB_TOKEN is capped by the caller job's
# `permissions:` — it can narrow them, never widen them. So callers grant
# the ceiling (contents: read + packages: write); this file narrows per job:
# verify (runs the Dockerfile + the image) only gets contents: read.
on:
  workflow_call:
    inputs:
      image:
        description: Folder name under images/ — also the GHCR image name
        required: true
        type: string

permissions:
  contents: read

env:
  # build-push-action's per-build record artifacts: noise here (the job
  # summary already shows the build); keep its job-summary table.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      buildkit: ${{ steps.vars.outputs.buildkit }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      # persist-credentials: false — nothing here needs git auth afterwards,
      # and the build/smoke steps run code from the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile contract lint
        run: |
          set -euo pipefail
          # same rule as _discover-images.yml: a valid GHCR path component
          if [[ ! "$IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::inputs.image '$IMAGE' is not a valid image name"; exit 1
          fi
          df="images/$IMAGE/Dockerfile"
          [ -f "$df" ] || { echo "::error::$df not found"; exit 1; }
          fail=0
          err() { echo "::error file=$df::$1"; fail=1; }
          lines() { tr '\n' ' ' <<<"$1"; }

          # Base: nginx-unprivileged, stable (even minor) alpine-slim, digest-pinned
          mapfile -t froms < <(awk 'toupper($1) == "FROM" { print $2 }' "$df")
          if [ "${#froms[@]}" -ne 1 ]; then
            err "expected exactly one FROM, found ${#froms[@]}"
          elif [[ ! "${froms[0]}" =~ ^nginxinc/nginx-unprivileged:([0-9]+)\.([0-9]+)(\.[0-9]+)?-alpine-slim@sha256:[0-9a-f]{64}$ ]]; then
            err "base must be nginxinc/nginx-unprivileged:<stable>-alpine-slim@sha256:<digest>, got '${froms[0]}'"
          elif (( 10#${BASH_REMATCH[2]} % 2 )); then
            err "nginx ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} is a mainline (odd) minor — stable channel only"
          fi

          # COPY-only: no RUN (would need QEMU for arm64), no ADD (remote
          # URLs, git sources, auto-extraction), no ONBUILD (deferred
          # instructions for whoever builds FROM this image)
          if bad=$(grep -nEi '^[[:space:]]*(RUN|ADD|ONBUILD)([[:space:]]|$)' "$df"); then
            err "COPY-only contract — RUN/ADD/ONBUILD found: $(lines "$bad")"
          fi
          # ...and only from the build context: COPY --from=<image> pulls a
          # second, unpinned image; so would an unpinned `# syntax=` frontend
          if bad=$(grep -nEi '^[[:space:]]*COPY[[:space:]].*--from' "$df"); then
            err "COPY --from not allowed (single-stage, the base is the only image): $(lines "$bad")"
          fi
          if bad=$(grep -nEi '^#[[:space:]]*syntax[[:space:]]*=' "$df" | grep -vE '@sha256:[0-9a-f]{64}'); then
            err "a '# syntax=' frontend must be digest-pinned: $(lines "$bad")"
          fi
          if [ "$fail" -eq 0 ]; then echo "OK: ${froms[0]}, COPY-only"; fi
          exit "$fail"

      # Shared with publish via job outputs.
      - id: vars
        run: |
          set -euo pipefail
          buildkit=$(awk 'toupper($1) == "FROM" { print $2; exit }' .github/tool-images/buildkit/Dockerfile)
          if [[ ! "$buildkit" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=.github/tool-images/buildkit/Dockerfile::BuildKit image must be digest-pinned, got '$buildkit'"; exit 1
          fi
          echo "buildkit=$buildkit" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: image=${{ steps.vars.outputs.buildkit }}

      # Same platforms as publish, result kept in the builder's cache only:
      # proves the (possibly just bumped) base exists for arm64 too.
      # Cache: read-only here — publish owns writing the per-image scope.
      - name: Build linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ inputs.image }}

      - name: Load linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ inputs.image }}
          platforms: linux/amd64
          load: true
          tags: phw-verify/${{ inputs.image }}:${{ steps.vars.outputs.sha_short }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ inputs.image }}

      - name: Smoke test (image contract, --read-only --tmpfs /tmp)
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          set -euo pipefail
          c=phw-smoke
          docker run -d --name "$c" --read-only --tmpfs /tmp \
            -p 127.0.0.1:8080:8080 "phw-verify/$IMAGE:$SHA_SHORT" >/dev/null
          trap 'echo "--- container log ---"; docker logs "$c" 2>&1 || true; docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          base=http://127.0.0.1:8080
          running() { docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null || echo false; }

          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$base/healthz" 2>/dev/null && break
            [ "$(running)" = true ] || break   # exited: the checks below report it
            sleep 1
          done

          failed=0
          rows=()
          report() { # <PASS|FAIL> <check> <detail>
            rows+=("| $1 | $2 | $3 |")
            if [ "$1" = PASS ]; then echo "PASS  $2: $3"
            else echo "::error title=Image contract::$2: $3"; failed=1; fi
          }
          expect() { # <check> <expected> <actual>
            if [ "$2" = "$3" ]; then report PASS "$1" "\`$3\`"
            else report FAIL "$1" "expected \`$2\`, got \`$3\`"; fi
          }
          get() { # <path> → sets code, ctype, body
            local out
            out=$(curl -sS -o "$RUNNER_TEMP/body" -w '%{http_code} %{content_type}' "$base$1" || true)
            code=${out%% *}; ctype=${out#* }; ctype=${ctype%%;*}
            body=$(cat "$RUNNER_TEMP/body" 2>/dev/null || true)
          }

          get /healthz
          expect "GET /healthz status" 200 "$code"
          expect "GET /healthz body" ok "$body"
          get /version.txt
          expect "GET /version.txt status" 200 "$code"
          expect "GET /version.txt body = short SHA" "$SHA_SHORT" "$body"
          get /
          expect "GET / status" 200 "$code"
          expect "GET / content-type" text/html "$ctype"

          # uid of the container's PID 1 as seen from the host (no exec, so
          # it works for any image). Contract: uid 101, real and effective.
          pid=$(docker inspect -f '{{.State.Pid}}' "$c" 2>/dev/null || echo 0)
          ruid=; euid=
          if [ "$pid" != 0 ]; then
            read -r _ ruid euid _ <<<"$(grep '^Uid:' "/proc/$pid/status" 2>/dev/null || true)" || true
          fi
          if [ -z "$euid" ]; then
            report FAIL "process uid = 101" "container not running (pid \`$pid\`)"
          elif [ "$ruid" = 101 ] && [ "$euid" = 101 ]; then
            report PASS "process uid = 101" "uid \`$euid\`"
          else
            report FAIL "process uid = 101" "real \`$ruid\`, effective \`$euid\`"
          fi

          expect "still running after checks" true "$(running)"

          {
            echo "### Image contract: \`$IMAGE\` @ \`$SHA_SHORT\` (linux/amd64, read-only rootfs)"
            echo
            echo "| Result | Check | Detail |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions replace the workflow-level set, hence both lines.
    permissions:
      contents: read
      packages: write
    # :latest must never move backwards. Serialization alone doesn't order
    # runs (an older run whose verify finished later would publish last),
    # so: (1) publishes of an image+ref run one at a time, and (2) inside
    # that critical section, latest is only tagged if this commit is STILL
    # the default branch head. Together: whichever run publishes last, a
    # stale one skips latest. (A queued publish superseded by a newer
    # queued one is cancelled — that commit then has no sha- tag; rare.)
    concurrency:
      group: publish-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: head
        name: Still the default branch head? (gates :latest)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          latest=false
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
            if [ "$head" = "$GITHUB_SHA" ]; then
              latest=true
            else
              echo "::notice::$DEFAULT_BRANCH moved on to ${head::7} — publishing sha-${GITHUB_SHA::7} without :latest"
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: image=${{ needs.verify.outputs.buildkit }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels on each platform's config; also as index annotations,
      # which is what GHCR's package page reads for multi-arch images.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.head.outputs.latest }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
          annotations: |
            org.opencontainers.image.title=${{ inputs.image }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ needs.verify.outputs.sha_short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Check pushed platforms
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          REF="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE"
          docker buildx imagetools inspect "$REF@$DIGEST" | tee "$RUNNER_TEMP/inspect.txt"
          platforms=$(docker buildx imagetools inspect "$REF@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          {
            echo "### Published \`$REF\`"
            echo
            while read -r t; do if [ -n "$t" ]; then echo "- \`$t\`"; fi; done <<<"$TAGS"
            echo "- digest \`$DIGEST\`, platforms \`$platforms\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/inspect.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "::error::expected linux/amd64,linux/arm64 in the pushed index, got '$platforms'"; exit 1
          fi
