name: image-gradient-ripple

# Build of images/gradient-ripple: verify on pull requests, verify + publish on main.
# The logic is in _build-image.yml; how the callers work: README.md here.
on:
  push:
    branches:
      - main
    paths:
      - 'images/gradient-ripple/**'
      - '!images/gradient-ripple/tools/**'
      - '.github/workflows/image-gradient-ripple.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'
  pull_request:
    paths:
      - 'images/gradient-ripple/**'
      - '!images/gradient-ripple/tools/**'
      - '.github/workflows/image-gradient-ripple.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'

permissions:
  contents: read

jobs:
  build:
    # The ceiling for _build-image.yml: a called workflow can only narrow it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: gradient-ripple
