name: build-image-branch

# On demand: verify + publish sha-<short7> of one image folder, or of all
# of them, at the ref chosen with --ref. Usage and caveats: README.md here.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image folder under images/ (e.g. snake), or "all" (reserved: no folder may have that name)'
        required: true
        type: string

run-name: build ${{ inputs.image }} @ ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  # One image, by name: no discovery needed.
  one:
    if: inputs.image != 'all'
    # The ceiling for _build-image.yml: a called workflow can only narrow it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ${{ inputs.image }}

  discover:
    if: inputs.image == 'all'
    permissions:
      contents: read
    uses: ./.github/workflows/_discover-images.yml

  all:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    # The ceiling for _build-image.yml, as in `one`.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ${{ matrix.image }}
