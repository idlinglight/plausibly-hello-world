name: build-image-branch

# Build images of ANY ref without merging: verify + publish sha-<short7>
# (latest only with --ref main while it is main's head, as in main's own
# publish: _build-image.yml decides).
#
# Default — dispatch one image folder, or all of them:
#   gh workflow run build-image-branch.yml --ref <branch> -f image=<name>
#   gh workflow run build-image-branch.yml --ref <branch> -f image=all
# Works for any branch GitHub has (a PR head, a Dependabot branch) and for
# a new image whose caller isn't on main yet. GitHub only offers dispatch
# for workflows on the default branch, but the run uses the workflow files
# AT --ref (this one and _build-image.yml), so changes to the build itself
# are exercised too — the ref needs a version of this file with the
# dispatch trigger.
#
# Older route, still working: push ANY state to build-image/** → all
# images, then delete the branch (the tags stay):
#   git push origin HEAD:build-image/<topic>
# The dispatch covers everything it does; it stays until the comments in
# the image callers and _build-image.yml that point here are next edited
# anyway (editing them re-verifies and re-publishes images).
#
# Why a fan-out instead of build-image/** in each image caller: on.push
# `paths:` is evaluated against the push's OWN diff, not against main.
# Verified 2026-10-29 with a throwaway probe workflow:
#   - new branch whose commits are all already on GitHub (re-pushing a PR
#     head) → empty diff → a paths-filtered workflow does NOT run
#   - new branch with new commits → diff against the parent of the oldest
#     new commit → runs only if THOSE commits touch the paths
# So with paths, the typical `git push origin HEAD:build-image/x` silently
# builds nothing. This workflow has no paths filter; "all" means every
# folder under images/*/ — new folders need no change here.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image folder under images/ (e.g. snake), or "all"'
        required: true
        type: string
  push:
    branches:
      - 'build-image/**'

run-name: build ${{ inputs.image || 'all' }} @ ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  # One image: no discovery. _build-image.yml checks the name and that
  # images/<name>/Dockerfile exists at this ref (its lint step fails
  # otherwise, before anything is built).
  one:
    if: github.event_name == 'workflow_dispatch' && inputs.image != 'all'
    # Ceiling for _build-image.yml, which narrows per job (see there).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ${{ inputs.image }}

  discover:
    if: github.event_name == 'push' || inputs.image == 'all'
    permissions:
      contents: read
    uses: ./.github/workflows/_discover-images.yml

  all:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ${{ matrix.image }}
