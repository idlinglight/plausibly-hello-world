name: image-snake

# Build of images/snake by _build-image.yml. Notes: _build-image.md
# ("Callers"), beside this file.
on:
  push:
    branches:
      - main
    paths:
      - 'images/snake/**'
      - '!images/snake/tools/**'
      - '.github/workflows/image-snake.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'
  pull_request:
    paths:
      - 'images/snake/**'
      - '!images/snake/tools/**'
      - '.github/workflows/image-snake.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'

permissions:
  contents: read

jobs:
  build:
    # The ceiling for _build-image.yml's jobs (_build-image.md).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: snake
