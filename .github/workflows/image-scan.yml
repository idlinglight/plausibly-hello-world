name: image-scan

# CVE scan of every published image (Grype, digest-pinned in
# tool-images/grype/): fails on fixable HIGH/CRITICAL findings, lists ignored
# ones with their rule's reason. Why it is built this way, and what to do
# when it fails: README.md here.
on:
  schedule:
    - cron: '30 19 * * 5'
      timezone: Europe/Vienna
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to scan in every image
        default: latest
        type: string
  # A change to this file, the scanner pin or its rules: scan :latest, else
  # sha-<PR head short7> (a test tag of the PR's branch), before merging.
  pull_request:
    paths:
      - '.github/workflows/image-scan.yml'
      - 'tool-images/grype/**'

permissions:
  contents: read

jobs:
  # Pull requests: the repository pins nothing released less than 3 days
  # ago, and Dependabot's cooldown can't see release dates on ghcr.io.
  scanner-age:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tool-images/grype

      - name: Scanner release at least 3 days old
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin=tool-images/grype/Dockerfile
          ref=$(awk 'toupper($1) == "FROM" { print $2; exit }' "$pin")
          tag=${ref%@*}; tag=${tag##*:}
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=$pin::expected a vX.Y.Z tag on the FROM line, got '$tag'"; exit 1
          fi
          released=$(gh api "repos/anchore/grype/releases/tags/$tag" --jq '.published_at | fromdateiso8601')
          ready=$(( released + 3 * 86400 ))
          at() { jq -rn --argjson t "$1" '$t | todate'; }
          if (( $(date -u +%s) < ready )); then
            echo "::error file=$pin::grype $tag was released $(at "$released"): too new to pin before $(at "$ready") (re-run this job then)"
            exit 1
          fi
          echo "grype $tag, released $(at "$released"): ok"
          echo "Scanner \`$tag\`, released $(at "$released"): at least 3 days old." >> "$GITHUB_STEP_SUMMARY"

  discover:
    permissions:
      contents: read
    uses: ./.github/workflows/_discover-images.yml

  scan:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    name: scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: pulls need nothing more, also for a private package of
    # this repository's own.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      # Scanner pin + config, and this image's Dockerfile (for the base hint)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tool-images/grype
            images/${{ matrix.image }}

      - id: probe
        name: Resolve tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY_OWNER,,}/phw-$IMAGE"   # published name: same rule as _build-image.yml
          echo "ref=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            candidates=(latest "sha-${PR_HEAD_SHA::7}")
          else
            candidates=("${INPUT_TAG:-latest}")
          fi
          skip() { # <reason>
            echo "::warning title=Not published::ghcr.io/$repo: $1 — skipped"
            echo "### \`$IMAGE\`: skipped — $1" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Registry pull token from GITHUB_TOKEN (credentials via stdin, not
          # argv). An unpublished package still gets a token (and a 404 for
          # its manifest), so a REFUSED token is an access problem: fail.
          resp=$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$TOKEN" | curl -sS -K - \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull")
          bearer=$(jq -r '.token // empty' <<<"$resp")
          if [ -z "$bearer" ]; then
            echo "token endpoint: $resp"
            echo "::error::ghcr.io/$repo: registry refused a pull token — check the package's 'Manage Actions access' grants this repo read"
            exit 1
          fi

          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          m="$RUNNER_TEMP/manifest.json"
          for tag in "${candidates[@]}"; do
            status=$(curl -sS -o "$m" -D "$RUNNER_TEMP/headers.txt" -w '%{http_code}' \
              -H "Authorization: Bearer $bearer" -H "Accept: $accept" \
              "https://ghcr.io/v2/$repo/manifests/$tag")
            echo "GET /v2/$repo/manifests/$tag → HTTP $status"
            case "$status" in
              200)
                digest=$(awk 'tolower($1) == "docker-content-digest:" { print $2 }' "$RUNNER_TEMP/headers.txt" | tr -d '\r')
                # The linux/amd64 manifest digest — pulling that (not the
                # index) gives a complete single-platform image, so `docker
                # save` works with the classic AND the containerd store.
                case "$(jq -r '.mediaType // empty' "$m")" in
                  *index*|*manifest.list*)
                    amd64=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty' "$m") ;;
                  *) amd64=$digest ;;
                esac
                for d in "$digest" "$amd64"; do
                  if [[ ! "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    cat "$RUNNER_TEMP/headers.txt" "$m"
                    echo "::error::ghcr.io/$repo:$tag: could not resolve index / linux/amd64 digest ('$d')"; exit 1
                  fi
                done
                printf 'found=true\ntag=%s\ndigest=%s\namd64=%s\n' "$tag" "$digest" "$amd64" >> "$GITHUB_OUTPUT"
                echo "scanning ghcr.io/$repo:$tag @ $digest (linux/amd64 $amd64)"
                exit 0 ;;
              404)
                cat "$m"; echo ;;
              *)
                cat "$m"; echo
                echo "::error::ghcr.io/$repo:$tag: unexpected HTTP $status"; exit 1 ;;
            esac
          done
          skip "no tag ${candidates[*]} published yet"

      - name: Pull image (linux/amd64), export it for the scanner
        if: steps.probe.outputs.found == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.probe.outputs.ref }}
          AMD64: ${{ steps.probe.outputs.amd64 }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$REF@$AMD64"
          docker logout ghcr.io
          mkdir -p "$RUNNER_TEMP/scan" "$RUNNER_TEMP/grype-db"
          docker tag "$REF@$AMD64" "scan-target/$IMAGE:amd64"
          docker save -o "$RUNNER_TEMP/scan/image.tar" "scan-target/$IMAGE:amd64"

      # The scanner container gets the tarball and its config (read-only), a
      # DB cache folder and network for the DB download: no token, no docker
      # socket, no workspace.
      - name: Scan (Grype)
        if: steps.probe.outputs.found == 'true'
        run: |
          set -euo pipefail
          pin=tool-images/grype/Dockerfile
          grype=$(awk 'toupper($1) == "FROM" { print $2; exit }' "$pin")
          if [[ ! "$grype" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=$pin::scanner image must be digest-pinned, got '$grype'"; exit 1
          fi
          docker run --rm \
            --read-only --tmpfs /tmp:mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TMPDIR=/tmp \
            -e GRYPE_DB_CACHE_DIR=/db \
            -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            -v "$RUNNER_TEMP/grype-db:/db" \
            -v "$RUNNER_TEMP/scan/image.tar:/in/image.tar:ro" \
            -v "$PWD/tool-images/grype/grype.yaml:/cfg/grype.yaml:ro" \
            "$grype" -c /cfg/grype.yaml docker-archive:/in/image.tar -o json \
            > "$RUNNER_TEMP/scan/grype.json"
          jq -c '{matches: (.matches | length), ignored: ((.ignoredMatches // []) | length), distro: "\(.distro.name) \(.distro.version)", grype: .descriptor.version}' \
            "$RUNNER_TEMP/scan/grype.json"

      - name: Report
        if: steps.probe.outputs.found == 'true'
        env:
          REF: ${{ steps.probe.outputs.ref }}
          TAG: ${{ steps.probe.outputs.tag }}
          DIGEST: ${{ steps.probe.outputs.digest }}
          AMD64: ${{ steps.probe.outputs.amd64 }}
        run: |
          set -euo pipefail
          j="$RUNNER_TEMP/scan/grype.json"
          # Is a fix even available to us? Compare the Dockerfile's pinned
          # base digest with what its tag points to upstream right now.
          base=$(awk 'toupper($1) == "FROM" { print $2; exit }' "images/$IMAGE/Dockerfile")
          base_tag=${base%@*}; base_pin=${base#*@}
          upstream=$(docker buildx imagetools inspect "$base_tag" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)
          if [ -z "$upstream" ]; then
            base_hint="could not resolve \`$base_tag\` upstream"
          elif [ "$upstream" = "$base_pin" ]; then
            base_hint="\`$base_tag\` upstream is still the pinned digest — a fix needs a new upstream build (or a deliberate channel move)"
          else
            base_hint="\`$base_tag\` upstream has a newer digest \`$upstream\` — expect a Dependabot bump (after its 3-day cooldown) or bump manually"
          fi
          # "fixable" = the distro/ecosystem has a fixed version
          defs='
            def rank: {"Critical":0,"High":1,"Medium":2,"Low":3,"Negligible":4}[.] // 5;
            def fixable: .vulnerability.fix.state == "fixed";
            def gate: fixable and (.vulnerability.severity | IN("Critical","High"));
            def vuln: .vulnerability | if (.dataSource // "") == "" then .id else "[\(.id)](\(.dataSource))" end;
            def sorted: sort_by((.vulnerability.severity | rank), .artifact.name, .vulnerability.id) | .[];
          '
          q() { jq -r "$defs $1" "$j"; }
          gate=$(q '[.matches[] | select(gate)] | length')
          nfix=$(q '[.matches[] | select(fixable)] | length')
          nopen=$(q '[.matches[] | select(fixable | not)] | length')
          nign=$(q '.ignoredMatches // [] | length')
          # $m / $s below are jq variables, single quotes intended
          # shellcheck disable=SC2016
          {
            if [ "$gate" -eq 0 ]; then echo "### \`$IMAGE\`: PASS — no fixable HIGH/CRITICAL"
            else echo "### \`$IMAGE\`: FAIL — $gate fixable HIGH/CRITICAL"; fi
            echo
            echo "\`$REF:$TAG\` · index \`$DIGEST\` · linux/amd64 \`$AMD64\` · $(q '"\(.distro.name) \(.distro.version) · grype \(.descriptor.version) · DB built \(.descriptor.db.status.built // .descriptor.db.built // "?")"')"
            echo
            echo "Base: $base_hint."
            echo
            echo "| Severity | Fixable | Not fixable |"
            echo "| --- | ---: | ---: |"
            q '[.matches[] | {s: .vulnerability.severity, f: fixable}] as $m
               | ["Critical","High","Medium","Low","Negligible","Unknown"][] as $s
               | "| \($s) | \([$m[] | select(.s == $s and .f)] | length) | \([$m[] | select(.s == $s and (.f | not))] | length) |"'
            if [ "$nfix" -gt 0 ]; then
              echo
              echo "#### Fixable ($nfix)"
              echo
              echo "| Severity | Vulnerability | Package | Installed | Fixed in |"
              echo "| --- | --- | --- | --- | --- |"
              q '.matches | sorted | select(fixable)
                 | "| \(.vulnerability.severity) | \(vuln) | \(.artifact.name) | \(.artifact.version) | \((.vulnerability.fix.versions // []) | join(", ")) |"'
            fi
            # Suppressed findings stay visible — with the rule's reason.
            if [ "$nign" -gt 0 ]; then
              echo
              echo "#### Ignored ($nign) — rules in \`tool-images/grype/grype.yaml\`"
              echo
              echo "| Severity | Vulnerability | Package | Installed | Fixed in | Reason |"
              echo "| --- | --- | --- | --- | --- | --- |"
              q '.ignoredMatches | sorted
                 | "| \(.vulnerability.severity) | \(vuln) | \(.artifact.name) | \(.artifact.version) | \((.vulnerability.fix.versions // []) | join(", ") | if . == "" then "–" else . end) | \([.appliedIgnoreRules[] | .reason // "(no reason given)"] | unique | join("; ") | gsub("\\|"; "/")) |"'
            fi
            if [ "$nopen" -gt 0 ]; then
              echo
              echo "<details><summary>Not fixable yet ($nopen)</summary>"
              echo
              echo "| Severity | Vulnerability | Package | Installed | Fix state |"
              echo "| --- | --- | --- | --- | --- |"
              q '.matches | sorted | select(fixable | not)
                 | "| \(.vulnerability.severity) | \(vuln) | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.fix.state | if (. // "") == "" then "unknown" else . end) |"'
              echo
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$nign" -gt 0 ]; then
            echo "::warning title=Ignored findings::$IMAGE:$TAG — $nign finding(s) suppressed by grype.yaml rules, listed in the job summary"
          fi
          if [ "$gate" -gt 0 ]; then
            echo "::error title=Fixable HIGH/CRITICAL::$IMAGE:$TAG has $gate. Base: $base_hint"
            exit 1
          fi
