name: image-south-america-quiz

# Build of images/south-america-quiz: verify on pull requests, verify + publish on main.
# The logic is in _build-image.yml; how the callers work: README.md here.
on:
  push:
    branches:
      - main
    paths:
      - 'images/south-america-quiz/**'
      - '!images/south-america-quiz/tools/**'
      - '.github/workflows/image-south-america-quiz.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'
  pull_request:
    paths:
      - 'images/south-america-quiz/**'
      - '!images/south-america-quiz/tools/**'
      - '.github/workflows/image-south-america-quiz.yml'
      - '.github/workflows/_build-image.yml'
      - 'tool-images/buildkit/**'

permissions:
  contents: read

jobs:
  build:
    # The ceiling for _build-image.yml's jobs (README.md here).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: south-america-quiz
