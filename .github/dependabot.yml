# Dependabot version updates. Notes: dependabot.md, beside this file.
version: 2
updates:
  # Base images (images/*/Dockerfile).
  - package-ecosystem: docker
    directories:
      - /images/*          # a glob: new folders join on their own
    schedule:
      interval: daily
      time: "16:05"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    groups:
      # One PR per dependency across ALL folders: a base-digest bump for
      # N image folders arrives as one PR (and one review).
      docker:
        group-by: dependency-name
    ignore:
      # nginx: stay on the stable (even-minor) channel — 1.30 → 1.31 is a
      # mainline switch, and 1.30 → 1.32 (next stable line) is also
      # deliberate. Digest bumps within 1.30-alpine-slim still arrive.
      - dependency-name: nginx/nginx-unprivileged
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The tool-image pins (tool-images/*/Dockerfile, never built).
  - package-ecosystem: docker
    directories:
      - /tool-images/*
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    groups:
      # One PR per dependency: buildkit and grype bumps stay separate PRs.
      docker:
        group-by: dependency-name

  # Actions are SHA-pinned with version comments; Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
